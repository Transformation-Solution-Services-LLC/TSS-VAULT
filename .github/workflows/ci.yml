# Runs the suite on every push to main and every pull request, against both
# stores: in memory, and a real Postgres started for the job. No secrets:
# sign-in uses a stand-in Cockpit and nothing calls out.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vault_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/vault_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Test
        run: npm test
      - name: Production dependencies have no known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  # Case notes on a phone with no signal, in a real browser (test/mobile-e2e.test.mjs).
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Install the browser
        run: npm install --no-save --no-audit --no-fund playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Offline case notes on a phone
        run: REQUIRE_BROWSER=1 SCREENSHOT_DIR=mobile-screens node --test test/mobile-e2e.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-screens
          path: mobile-screens/
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t tss-vault .
