<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1eee5">
  <title>Vault</title>
  <link rel="icon" href="/brand/vault.png" type="image/png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Vault">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <div class="card login-card">
      <h1 class="brandbar brandbar-login"><picture><source srcset="/brand/tss-wordmark-light.webp" media="(prefers-color-scheme: dark)"><img class="brandbar-tss" src="/brand/tss-wordmark.webp" alt="TSS"></picture><img class="brandbar-icon" src="/brand/vault.png" alt=""><span class="brandbar-name">Vault</span><picture><source srcset="/brand/wally-vault-still.svg" media="(prefers-reduced-motion: reduce)"><img class="brandbar-wally" src="/brand/wally-vault.svg" alt="Wally, the TSS robot"></picture></h1>
      <p class="muted">The team's workspace: the message board, case notes and the client directory.</p>
      <p id="login-message">You sign in to Vault through Cockpit. Open Vault from Cockpit's app launcher.</p>
      <button id="cockpit-link" type="button" class="primary" hidden>Go to Cockpit</button>
      <button id="dev-signin" type="button" hidden>Developer sign-in</button>
      <p id="login-error" class="error" role="alert"></p>
    </div>
  </div>

  <div id="app" class="shell" hidden>
    <aside class="side">
      <a class="brandbar" href="#/"><picture><source srcset="/brand/tss-wordmark-light.webp" media="(prefers-color-scheme: dark)"><img class="brandbar-tss" src="/brand/tss-wordmark.webp" alt="TSS"></picture><img class="brandbar-icon" src="/brand/vault.png" alt=""><span class="brandbar-name">Vault</span><picture><source srcset="/brand/wally-vault-still.svg" media="(prefers-reduced-motion: reduce)"><img class="brandbar-wally" src="/brand/wally-vault.svg" alt="Wally, the TSS robot"></picture></a>
      <nav class="nav" aria-label="Vault">
        <a href="#/" data-view="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11L12 4l8.5 7v9h-5.5v-5.5h-6V20H3.5z"/></svg><span>Home</span></a>
        <a href="#/board" data-view="board"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Message Board</span></a>
        <a href="#/notes" data-view="notes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2.5h8.5L19 7v14.5H6z"/><path d="M14 2.5V7.5h5M9 12h7M9 16h5"/></svg><span>Case Notes</span><span class="badge" data-pending hidden></span></a>
        <a href="#/directory" data-view="directory"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 6h5M16 10h5M17 14h4"/></svg><span>Directory</span></a>
        <a href="#/import" data-view="import" data-manage hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg><span>Import</span></a>
        <a href="#/activity" data-view="activity" data-manage hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><span>Activity</span></a>
      </nav>
      <div class="spacer"></div>
      <div id="who" class="health"></div>
      <div id="health" class="health muted"></div>
    </aside>
    <main class="main">
      <section id="view"></section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <div id="modal" class="modal" hidden role="dialog" aria-modal="true"><div class="card modal-card" id="modal-body"></div></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
